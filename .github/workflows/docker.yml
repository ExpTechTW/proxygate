name: Docker

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true
        default: edge
      version:
        description: Software version
        required: true
        default: 0.1.0-dev
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image and version metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            image_tag="$GITHUB_REF_NAME"
          else
            version="${{ inputs.version }}"
            image_tag="${{ inputs.image_tag }}"
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]]; then
            echo "version must use semantic version format" >&2
            exit 1
          fi
          echo "VERSION_MAJOR=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "VERSION_MINOR=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          echo "VERSION_PATCH=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
          echo "VERSION_PRE_RELEASE=${BASH_REMATCH[5]}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && -z "${BASH_REMATCH[5]}" ]]; then
            echo "PUBLISH_LATEST=true" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ env.PUBLISH_LATEST }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION_MAJOR=${{ env.VERSION_MAJOR }}
            VERSION_MINOR=${{ env.VERSION_MINOR }}
            VERSION_PATCH=${{ env.VERSION_PATCH }}
            VERSION_PRE_RELEASE=${{ env.VERSION_PRE_RELEASE }}
            BUILD_CHANNEL=github-actions-docker
            BUILD_COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
